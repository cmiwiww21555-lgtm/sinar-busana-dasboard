<script>
const $=s=>document.querySelector(s),F=n=>Math.round(n).toLocaleString('id-ID'),P=n=>n==null?'—':n.toFixed(1).replace('.',',')+'%';
const addD=(s,n)=>{const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const TODAY='2026-10-28',SAM=15,MIN=480,TL=583,TA=3500,L=[1,2,3,4,5,6],HR=[7,8,9,10,11,13,14,15];

let S,f,cur=0;const nid=p=>p+'-'+String(S.n++).padStart(4,'0'),sum=(a,k)=>a.reduce((s,x)=>s+x[k],0);
const dfl=()=>({from:addD(TODAY,-6),to:TODAY,line:'all',cat:'all',ctry:'all'});
function gen(){let s=42;const r=()=>(s=s*16807%2147483647)/2147483647;S={prod:[],qc:[],wf:[],po:[],mv:[],tx:[],wip:{},n:1};
const base=[605,590,598,520,592,570],dr=[.028,.024,.034,.062,.027,.045],ops=[22,23,21,24,22,22],ts0=addD(TODAY,-1);
for(let k=13;k>=0;k--){const d=addD(TODAY,-k);L.forEach(l=>{S.wf.push({id:nid('WF'),date:d,line:l,ops:ops[l-1]+(r()>.8?1:0),by:'SPV-0'+l,ts:d+' 07:00'});
HR.forEach((h,i)=>{if(k==0&&i>5)return;const o=Math.round(base[l-1]/8*(.88+r()*.24)),rate=dr[l-1]*(.7+r()*.6)*(1+k*.04),def=Math.round(o*rate/(1-rate)),c=Array(6).fill(0),ts=d+' '+String(h).padStart(2,'0')+':00';
for(let j=0;j<def;j++){const x=r();c[x<.3?0:x<.45?1:x<.6?2:x<.78?3:x<.9?4:5]++}
S.prod.push({id:nid('PR'),date:d,line:l,hour:h,out:o,by:'SPV-0'+l,ts});S.qc.push({id:nid('QC'),date:d,line:l,hour:h,insp:o+def,def,c,by:'QC-0'+l,ts});
if(d>=ts0){S.tx.push({id:nid('TX'),ts,type:'Output per jam',loc:'Sewing Line '+l,val:o+' pcs',by:'SPV-0'+l,st:'Valid (demo)'});S.tx.push({id:nid('TX'),ts,type:'Inspeksi QC',loc:'Sewing Line '+l,val:(o+def)+' diinspeksi / '+def+' cacat',by:'QC-0'+l,st:'Valid (demo)'})}})})}
S.tx.reverse();const w=[780,250,270,300,395,260,310,610,380,900];STN.forEach((x,i)=>S.wip[x[0]]={w:w[i],b:x[1],ts:TODAY+' 13:00'});
L.forEach(l=>{const n='Sewing '+l;S.mv.push({from:'Cutting',to:n,q:180+Math.round(r()*40),ts:TODAY+' 10:00'});S.mv.push({from:n,to:'Finishing',q:l==4?90:170+Math.round(r()*30),ts:TODAY+' 11:00'})});
S.po=PD.map(p=>({no:p[0],buyer:p[1],ctry:p[2],qty:p[3],sched:addD(TODAY,p[4]),act:p[5]==null?null:addD(TODAY,p[5]),st:p[6],prog:p[7]}))}
const rng=()=>{const a=[];for(let d=f.from;d<=f.to;d=addD(d,1))a.push(d);return a},nd=()=>rng().length;
function LSf(){return L.map(l=>{const q=a=>a.filter(x=>x.line==l&&x.date>=f.from&&x.date<=f.to),pr=q(S.prod),wf=q(S.wf),qc=q(S.qc);
const out=sum(pr,'out'),om=wf.reduce((s,w)=>s+w.ops*MIN/8*pr.filter(p=>p.date==w.date).length,0),ins=sum(qc,'insp'),df=sum(qc,'def');
return{l,out,n:pr.length,tgt:TL/8*pr.length,ops:wf.length?sum(wf,'ops')/wf.length:0,om,eff:om>0?out*SAM/om*100:null,ins,df,dr:ins>0?df/ins*100:null,c:CATS.map((_,i)=>qc.reduce((s,x)=>s+x.c[i],0))}})}
function T(){const LS=LSf(),s=LS.filter(x=>f.line=='all'||x.l==f.line),out=sum(s,'out'),n=sum(s,'n'),om=sum(s,'om'),ins=sum(s,'ins'),df=sum(s,'df');
return{LS,s,out,n,tgt:f.line=='all'?TA/48*n:TL/8*n,eff:om>0?out*SAM/om*100:null,ins,df,dr:ins>0?df/ins*100:null}}
function drr(a,b){const q=S.qc.filter(x=>x.date>=a&&x.date<=b&&(f.line=='all'||x.line==f.line)),i=sum(q,'insp');return i?sum(q,'def')/i*100:null}
function dser(){const ci=f.cat=='all'?-1:CATS.indexOf(f.cat);return rng().map(d=>{const q=S.qc.filter(x=>x.date==d&&(f.line=='all'||x.line==f.line)),i=sum(q,'insp'),df=ci<0?sum(q,'def'):q.reduce((s,x)=>s+x.c[ci],0);return{d,v:i?df/i*100:null}}).filter(x=>x.v!=null)}
const poSt=p=>{const dd=Math.round((new Date(p.act||TODAY)-new Date(p.sched))/864e5);if(p.act)return{dd,t:dd>0?'Terlambat '+dd+' hari':dd<0?'Lebih awal '+-dd+' hari':'Tepat waktu',r:dd>0?'Terlambat':'Selesai'};
if(dd>0)return{dd,t:'Lewat '+dd+' hari',r:'Lewat tenggat'};const left=-dd;return{dd,t:'Sisa '+left+' hari',r:left<=3&&p.prog<90?'Tinggi':left<=7&&p.prog<70?'Sedang':'Rendah'}};
function otd(){const due=S.po.filter(p=>p.sched>=f.from&&p.sched<=f.to&&p.sched<=TODAY&&(f.ctry=='all'||p.ctry==f.ctry)),late=due.filter(p=>p.act?p.act>p.sched:true).length;return{n:due.length,late,ok:due.length-late,v:due.length?(due.length-late)/due.length*100:null}}
const wst=x=>{const r=x.w/x.b;return r>1?'bad':r>=.8?'warn':'ok'},wl=c=>({ok:'Dalam batas',warn:'Mendekati batas',bad:'Melebihi batas'})[c],wt=()=>Object.entries(S.wip).map(([n,x])=>({n,...x,r:x.w/x.b,c:wst(x)}));
function issues(){const a=[],t=T(),add=(lv,c,t_,d,act,mon)=>a.push({lv,c,t:t_,d,act,mon});
t.s.forEach(x=>{if(x.n&&x.out<x.tgt)add(x.out<x.tgt*.9?'Critical':'Warning','Produksi','Output Lini '+x.l+' di bawah target',F(x.out)+' dari '+F(x.tgt)+' pcs ('+P(x.out/x.tgt*100)+')','Tinjau ketersediaan operator, material, dan downtime; pertimbangkan redistribusi operator dari lini yang melampaui target.','Output per jam dan akumulasi vs target kumulatif');
if(x.eff!=null&&x.eff<80)add(x.eff<75?'Critical':'Warning','Produksi','Efisiensi Lini '+x.l+' di bawah 80%','Efisiensi '+P(x.eff)+' dengan rata-rata '+x.ops.toFixed(1)+' operator','Evaluasi keseimbangan lini dan metode kerja; verifikasi SAM serta jumlah operator aktual.','Efisiensi harian, jumlah operator');
if(x.dr!=null&&x.dr>3)add(x.dr>5?'Critical':'Warning','Kualitas','Defect rate Lini '+x.l+' melebihi 3%',P(x.dr)+'; kategori terbanyak: '+CATS[x.c.indexOf(Math.max(...x.c))],'Inspeksi ulang, periksa mesin jahit, evaluasi metode kerja, atau pelatihan operator. Penyebab perlu diverifikasi di lapangan.','Defect rate per jam, cacat per kategori')});
const ds=dser().slice(-3);if(ds.length==3&&ds[0].v<ds[1].v&&ds[1].v<ds[2].v)add('Warning','Kualitas','Defect rate naik 3 periode berturut-turut',ds.map(x=>P(x.v)).join(' → '),'Mulai investigasi: bandingkan lini, kategori cacat, dan perubahan bahan/metode.','Defect rate harian');
S.po.filter(p=>!p.act).forEach(p=>{const s=poSt(p);if(s.r=='Lewat tenggat'||s.r=='Tinggi'||s.r=='Sedang')add(s.r=='Sedang'?'Warning':'Critical','Pengiriman','PO '+p.no+' ('+p.ctry+') berisiko: '+s.r.toLowerCase(),'Progres '+p.prog+'%, '+s.t+', status '+p.st,'Prioritaskan produksi PO ini, realokasi lini/lembur terkontrol, dan koordinasi dengan buyer. Catatan historis: pernah terjadi biaya air freight Rp180.000.000 (tidak otomatis terjadi).','Progres PO, output harian, tanggal ex-factory')});
wt().forEach(x=>{if(x.c!='ok')add(x.c=='bad'?'Critical':'Warning','WIP','WIP '+x.n+(x.c=='bad'?' melebihi':' mendekati')+' buffer',F(x.w)+' / '+F(x.b)+' ('+P(x.r*100)+')','Periksa kapasitas mesin/operator di stasiun, atur ulang prioritas aliran, dan tahan pasokan dari stasiun hulu bila perlu.','WIP vs buffer, aliran masuk-keluar')});
return a.sort((x,y)=>({Critical:0,Warning:1})[x.lv]-({Critical:0,Warning:1})[y.lv])}
const IC={p:'<path d="M3 21V9l6 4V9l6 4V5h6v16z"/>',e:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',q:'<path d="M5 13l4 4L19 7"/>',s:'<path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.5"/><circle cx="17" cy="18" r="1.5"/>',w:'<path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/>'};
const card=(k,t,v,s,c)=>`<div class="kpi ${c}"><div class="kt"><svg viewBox="0 0 24 24">${IC[k]}</svg>${t}</div><div class="kv">${v}</div><div class="ks">${s}</div></div>`,pill=(c,t)=>`<span class="pill ${c}">${t}</span>`,empty=()=>'<div class="card em">Belum ada data pada filter ini. Ubah rentang tanggal/lini atau klik “Reset simulasi”.</div>';
function bar(it,ref,rl,h=250){const w=600,m={l:46,b:34,t:24,r:10},mx=Math.max(ref||0,...it.map(i=>i.v))*1.15||1,bw=(w-m.l-m.r)/it.length,y=v=>h-m.b-v/mx*(h-m.b-m.t);let s=`<svg viewBox="0 0 ${w} ${h}" class="ch">`;
for(let i=0;i<=4;i++){const v=mx*i/4;s+=`<line x1="${m.l}" x2="${w-m.r}" y1="${y(v)}" y2="${y(v)}" class="gr"/><text x="${m.l-6}" y="${y(v)+4}" class="ax" text-anchor="end">${F(v)}</text>`}
it.forEach((o,i)=>{const x=m.l+i*bw+bw*.18,cx=x+bw*.32;s+=`<rect x="${x}" y="${y(o.v)}" width="${bw*.64}" height="${h-m.b-y(o.v)}" fill="${o.c}" rx="3"><title>${o.tip}</title></rect><text x="${cx}" y="${y(o.v)-5}" class="vl" text-anchor="middle">${F(o.v)}</text><text x="${cx}" y="${h-14}" class="ax" text-anchor="middle">${o.l}</text>`});
if(ref)s+=`<line x1="${m.l}" x2="${w-m.r}" y1="${y(ref)}" y2="${y(ref)}" stroke="var(--navy)" stroke-dasharray="5 4" style="stroke:var(--h)"/><text x="${w-m.r}" y="${y(ref)-4}" class="ax" text-anchor="end">${rl}</text>`;return s+'</svg>'}
function lc(lab,ser,refs,pf=P,h=250){const w=600,m={l:46,b:34,t:20,r:12},mx=Math.max(...ser.flatMap(s=>s.v),...refs.map(r=>r.v))*1.15||1,n=lab.length,x=i=>m.l+(n<2?(w-m.l-m.r)/2:i*(w-m.l-m.r)/(n-1)),y=v=>h-m.b-v/mx*(h-m.b-m.t);let s=`<svg viewBox="0 0 ${w} ${h}" class="ch">`;
for(let i=0;i<=4;i++){const v=mx*i/4;s+=`<line x1="${m.l}" x2="${w-m.r}" y1="${y(v)}" y2="${y(v)}" class="gr"/><text x="${m.l-6}" y="${y(v)+4}" class="ax" text-anchor="end">${pf==P?v.toFixed(0)+'%':F(v)}</text>`}

refs.forEach(r=>s+=`<line x1="${m.l}" x2="${w-m.r}" y1="${y(r.v)}" y2="${y(r.v)}" stroke="${r.c}" stroke-dasharray="5 4"/><text x="${w-m.r}" y="${y(r.v)-4}" class="ax" text-anchor="end">${r.l}</text>`);

function gauge(v){const a=Math.PI*(1-(v||0)/100),ex=120+90*Math.cos(a),ey=120-90*Math.sin(a),c=v>=100?'var(--ok)':'var(--bad)';
